<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra · Tests</title>
<style>
:root{color-scheme:dark;--bg:#070a14;--panel:#0d1222;--line:#1f2742;--text:#e8ebf7;--dim:#aab2cf;--ok:#4ade80;--ko:#ff5a5a;--run:#ffd166;--accent:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 8px 0 0}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim);background:transparent}
.chip b{color:var(--text)}.chip.ok b{color:var(--ok)}.chip.ko b{color:var(--ko)}
.chip[aria-pressed=true]{border-color:var(--ko);background:#2a1016}
.grow{flex:1}
input[type=search]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:220px;font:inherit}
.primary{background:var(--accent);color:#05070f;border:0;border-radius:8px;padding:7px 14px;font-weight:700}
.secondary{background:#1b2340;border:0;border-radius:8px;padding:7px 12px}
.primary:disabled{opacity:.5;cursor:default}
main{flex:1;display:grid;grid-template-columns:minmax(300px,420px) 1fr;min-height:0}
#list{overflow:auto;border-right:1px solid var(--line);padding:6px 0}
.file{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;color:var(--dim);font-weight:600;position:sticky;top:-6px;background:var(--bg);z-index:1}
.file .caret{border:0;background:none;width:20px;color:var(--dim);padding:0}
.file .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;text-align:left;padding:0;color:inherit;font-weight:600}
.file .cnt{font-weight:400;font-size:12px}
.row{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 30px;border-left:3px solid transparent}
.row:hover{background:#0f1529}
.row.sel{background:#141b33;border-left-color:var(--accent)}
.row .name{flex:1;border:0;background:none;text-align:left;padding:0;color:var(--text);min-width:0}
.row .ms{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.play{border:0;background:none;color:var(--dim);padding:2px 6px;border-radius:6px;visibility:hidden}
.row:hover .play,.file:hover .play,.row.sel .play,.play:focus{visibility:visible}
.play:hover{background:#1b2340;color:var(--text)}
.st{width:18px;text-align:center;flex:none}
.st.ok{color:var(--ok)}.st.ko{color:var(--ko)}.st.idle{color:#4b5578}.st.run{color:var(--run);animation:spin 1s linear infinite}.st.lost{color:var(--run)}
@keyframes spin{to{transform:rotate(360deg)}}
#detail{overflow:auto;overflow-x:hidden;padding:16px 20px}
#detail h2{font-size:18px;margin:0 0 4px}
.where{color:var(--dim);font-size:13px;margin:0 0 12px}
.where code{font:12px ui-monospace,monospace}
.status{display:inline-flex;gap:6px;align-items:center;font-weight:700;margin:0 0 12px}
.status.ok{color:var(--ok)}.status.ko{color:var(--ko)}.status.idle{color:var(--dim)}.status.run{color:var(--run)}
.err{overflow-wrap:anywhere;background:#1d0b10;border:1px solid #5c1d27;border-radius:10px;padding:10px 12px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;color:#ffc7c7;margin:0 0 14px}
.hint{color:var(--dim)}
iframe{width:100%;border:0;border-radius:12px;background:var(--bg);min-height:200px}
.empty{color:var(--dim);margin-top:15vh;text-align:center}
.empty p{margin:6px 0}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
footer{padding:4px 16px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:45% 55%}#list{border-right:0;border-bottom:1px solid var(--line)}input[type=search]{min-width:0;flex:1}}
</style>
</head>
<body>
<header>
  <h1>Astra · Tests</h1>
  <div class="chips">
    <span class="chip ok" title="Réussis"><b id="n-ok">0</b> ✔</span>
    <button class="chip ko" id="only-ko" aria-pressed="false" title="Ne montrer que les échecs"><b id="n-ko">0</b> ✖</button>
    <span class="chip" title="Pas encore lancés"><b id="n-idle">0</b> ○</span>
  </div>
  <input type="search" id="q" placeholder="Chercher un test…  ( / )" aria-label="Chercher un test">
  <span class="grow"></span>
  <button class="secondary" id="stop" hidden>■ Arrêter</button>
  <button class="primary" id="all">▶ Tout lancer</button>
</header>
<main>
  <nav id="list" aria-label="Tests"></nav>
  <section id="detail" aria-live="polite"></section>
</main>
<footer id="foot">Chargement…</footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const key = (file, name) => `${file}\u0000${name}`;
const ICON = { ok: '✔', ko: '✖', idle: '○', run: '◌', lost: '?' };
const LABEL = { ok: 'Réussi', ko: 'Échoué', idle: 'Pas encore lancé', run: 'En cours…', lost: 'Pas lancé : nom introuvable à l’exécution' };

let files = [];        // [{ file, tests: [{ name, line, scenario }] }]
const res = new Map(); // clé → { st, ms, error }
let sel = null;        // { file, name }
let running = false;
let lastRun = null;    // le dernier message de fin de lancement
const stamps = new Map(); // fichier → heure de son dernier rapport (recharger seulement ce qui a changé)
const closed = new Set();
let onlyKo = false;
let runId = 0;         // un nouveau lancement remplace l'ancien (le serveur l'arrête)

async function load() {
  files = await (await fetch('/api/tests')).json();
  const n = files.reduce((a, f) => a + f.tests.length, 0);
  $('foot').textContent = `${files.length} fichiers, ${n} tests. Les tests tournent avec node --test, un processus par fichier.`;
  render();
}

const st = (file, name) => res.get(key(file, name))?.st || 'idle';

function counts() {
  const c = { ok: 0, ko: 0, idle: 0 };
  for (const f of files) for (const t of f.tests) { const s = st(f.file, t.name); c[s in c ? s : 'idle']++; }
  $('n-ok').textContent = c.ok; $('n-ko').textContent = c.ko; $('n-idle').textContent = c.idle;
}

function render() {
  counts();
  const q = $('q').value.trim().toLowerCase();
  const html = [];
  for (const f of files) {
    const short = f.file.replace(/^tests\//, '');
    const tests = f.tests.filter((t) => (!q || t.name.toLowerCase().includes(q) || short.includes(q)) && (!onlyKo || st(f.file, t.name) === 'ko'));
    if (!tests.length && (q || onlyKo)) continue;
    const ko = f.tests.filter((t) => st(f.file, t.name) === 'ko').length;
    const ok = f.tests.filter((t) => st(f.file, t.name) === 'ok').length;
    const fst = f.tests.some((t) => st(f.file, t.name) === 'run') ? 'run' : ko ? 'ko' : ok === f.tests.length && ok ? 'ok' : 'idle';
    const open = !closed.has(f.file) || q || onlyKo;
    html.push(`<div class="file"><button class="caret" data-toggle="${esc(f.file)}" aria-label="${open ? 'Replier' : 'Déplier'}">${open ? '▾' : '▸'}</button><span class="st ${fst}">${ICON[fst]}</span><button class="fname" data-toggle="${esc(f.file)}">${esc(short)}</button><span class="cnt">${ko ? `${ko} ✖ · ` : ''}${f.tests.length}</span><button class="play" data-run-file="${esc(f.file)}" title="Lancer ce fichier" aria-label="Lancer ${esc(short)}">▶</button></div>`);
    if (!open) continue;
    for (const t of tests) {
      const r = res.get(key(f.file, t.name));
      const s = r?.st || 'idle';
      const isSel = sel && sel.file === f.file && sel.name === t.name;
      html.push(`<div class="row${isSel ? ' sel' : ''}" data-file="${esc(f.file)}" data-name="${esc(t.name)}"><span class="st ${s}" title="${LABEL[s]}">${ICON[s]}</span><button class="name">${esc(t.name)}</button>${r?.ms != null && s !== 'run' ? `<span class="ms">${r.ms} ms</span>` : ''}<button class="play" data-run title="Lancer ce test" aria-label="Lancer « ${esc(t.name)} »">▶</button></div>`);
    }
  }
  $('list').innerHTML = html.join('') || '<p class="hint" style="padding:12px">Aucun test ne correspond.</p>';
  detail();
}

function detail() {
  const d = $('detail');
  if (!sel) {
    d.dataset.k = '';
    d.innerHTML = `<div class="empty"><p><b>Choisis un test à gauche</b>, ou lance tout avec <b>▶ Tout lancer</b>.</p><p>Chaque test montre l’écran du joueur, image par image, et ce qu’il vérifie.</p><p class="hint"><kbd>/</kbd> chercher · <kbd>Entrée</kbd> lancer le test choisi</p>${lastRun?.stderr ? `<pre class="err" style="text-align:left">${esc(lastRun.stderr)}</pre>` : ''}</div>`;
    return;
  }
  const f = files.find((x) => x.file === sel.file);
  const t = f?.tests.find((x) => x.name === sel.name);
  if (!t) { sel = null; return detail(); }
  const k = key(f.file, t.name);
  const r = res.get(k);
  const s = r?.st || 'idle';
  // Autre test choisi : on refait le panneau. Même test : on ne touche qu'à l'en-tête, et la
  // simulation reste en place (pas de clignotement ni de saut de hauteur pendant un lancement).
  if (d.dataset.k !== k) {
    d.dataset.k = k;
    d.innerHTML = '<div id="d-head"></div><div id="d-sim"></div>';
  }
  const err = r?.error ? `<pre class="err">${esc(r.error.message)}${r.error.at ? `\n\n→ ${esc(r.error.at)}` : ''}</pre>` : '';
  $('d-head').innerHTML = `<h2>${esc(t.name)}</h2><p class="where"><code>${esc(f.file)}:${t.line}</code></p>${statusHtml(s, r)}${err}`;
  const box = $('d-sim');
  if (!t.scenario) {
    box.innerHTML = '<p class="hint">Ce test n’a pas de simulation. Pour en avoir une, écris-le avec <code>scenario()</code> (<code>tests/scenario.mjs</code>) : l’intitulé dit ce qui est attendu, et <code>film.look(…)</code> photographie chaque vérification.</p>';
    return;
  }
  const frame = $('sim');
  if (s === 'run') return; // la simulation d'avant reste affichée jusqu'au nouveau rapport
  if (s !== 'ok' && s !== 'ko') {
    if (!frame) box.innerHTML = '<p class="hint">Lance ce test (▶ dans la liste) pour voir sa simulation.</p>';
    return;
  }
  const src = `/reports/${f.file.replace(/^tests\//, '').replace(/\.mjs$/, '.html')}?v=${stamps.get(f.file) || 0}#scn=${encodeURIComponent(t.name)}`;
  if (frame) {
    // Nouveau rapport : on le charge dans le même cadre, qui garde sa hauteur jusqu'au chargement.
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    return;
  }
  box.innerHTML = `<iframe id="sim" title="Simulation du scénario" src="${esc(src)}"></iframe>`;
  $('sim').onload = (e) => fit(e.target);
}

const statusHtml = (s, r) => `<p class="status ${s === 'lost' ? 'run' : s}">${ICON[s]} ${LABEL[s]}${r?.ms != null && s !== 'run' ? ` · ${r.ms} ms` : ''}</p>`;

function fit(frame) {
  const doc = frame.contentDocument;
  if (!doc) return;
  const h = () => (frame.style.height = `${doc.documentElement.scrollHeight}px`);
  h();
  new ResizeObserver(h).observe(doc.body);
}

async function run(q) {
  const id = ++runId;
  running = true;
  $('all').disabled = true; $('stop').hidden = false;
  const targets = [];
  for (const f of files) {
    if (q.file && f.file !== q.file) continue;
    for (const t of f.tests) if (!q.name || t.name === q.name) targets.push(key(f.file, t.name));
  }
  for (const k of targets) res.set(k, { ...res.get(k), st: 'run' });
  render();
  const seen = new Set();
  let end = null;
  try {
    const r = await fetch('/api/run', { method: 'POST', body: JSON.stringify(q) });
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    let pending = 0;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const m = JSON.parse(buf.slice(0, i));
        buf = buf.slice(i + 1);
        if (m.type === 'end') { end = m; continue; }
        if (id !== runId) continue;
        const k = key(m.file, m.name);
        seen.add(k);
        res.set(k, { st: m.skip ? 'idle' : m.ok ? 'ok' : 'ko', ms: m.ms, error: m.error });
        // Beaucoup de tests : on redessine au plus une fois par image.
        if (!pending) pending = requestAnimationFrame(() => { pending = 0; render(); });
      }
    }
  } catch (e) {
    end = { stderr: String(e) };
  }
  if (id !== runId) return; // remplacé par un lancement plus récent
  for (const k of targets) if (!seen.has(k)) res.set(k, { st: end?.stopped ? 'idle' : 'lost' });
  running = false;
  lastRun = end;
  for (const file of new Set(targets.map((k) => k.split('\u0000')[0]))) stamps.set(file, Date.now());
  $('all').disabled = false; $('stop').hidden = true;
  // Après « Tout lancer » : on montre le premier échec.
  if (!q.file && !q.name) {
    const first = files.flatMap((f) => f.tests.map((t) => ({ file: f.file, name: t.name }))).find((x) => st(x.file, x.name) === 'ko');
    if (first) sel = first;
  }
  render();
  $('foot').textContent = end?.stopped ? 'Arrêté.' : `${end?.count ?? 0} test${end?.count > 1 ? 's' : ''} en ${((end?.ms ?? 0) / 1000).toFixed(1)} s${end?.code ? ' · au moins un échec' : ''}.`;
}

async function stop() {
  await fetch('/api/stop', { method: 'POST' });
}

$('list').addEventListener('click', (e) => {
  const tg = e.target.closest('[data-toggle]');
  if (tg) { const f = tg.dataset.toggle; closed.has(f) ? closed.delete(f) : closed.add(f); return render(); }
  const rf = e.target.closest('[data-run-file]');
  if (rf) return run({ file: rf.dataset.runFile });
  const row = e.target.closest('.row');
  if (!row) return;
  sel = { file: row.dataset.file, name: row.dataset.name };
  if (e.target.closest('[data-run]')) return run(sel);
  render();
});
$('all').onclick = () => run({});
$('stop').onclick = stop;
$('q').oninput = render;
$('only-ko').onclick = () => { onlyKo = !onlyKo; $('only-ko').setAttribute('aria-pressed', onlyKo); render(); };
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Enter' && sel && !running && document.activeElement === document.body) run(sel);
});
load();
</script>
</body>
</html>
